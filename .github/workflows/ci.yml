# Tests and builds every pull request and every push to main: server, Docker
# image, Android app and iOS app. "CI passed" at the end is the one check the
# main branch requires – Dependabot's auto-merge waits for it, see
# dependabot-auto-merge.yml.
#
# Green means "compiles and the tests pass", not "works": nothing here opens
# the map in a browser or taps through the apps (see "Never checked in a
# browser" in AGENTS.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR replaces the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same major as the Docker image (node:22).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts like in the Dockerfile: proves the prebuilt binaries
      # of better-sqlite3 and sharp suffice, and keeps install scripts of
      # updated packages from running here.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Includes the check that the iOS client's copy of openapi.json matches
      # the server.
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # amd64 only and never pushed; the release workflow builds both
      # platforms. Catches a base image that no longer fits the native modules.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          # Into the local Docker so the scan below can read it.
          load: true
          tags: ownsteps:ci
          # Fresh Debian security updates in every build, see the Dockerfile.
          build-args: APT_REFRESH=${{ github.run_id }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      # The tests above run outside the image, so this is the only check that
      # the image itself works: the entrypoint takes over an empty data
      # directory as root and drops to the node user, the server runs the
      # migrations and answers /api/health (which queries the database), and
      # the native modules better-sqlite3 and sharp load on this base image.
      # Dependabot's base image updates merge by themselves once this is green.
      - name: Start the image
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name ownsteps -p 127.0.0.1:2555:2555 \
            -v "$RUNNER_TEMP/data:/data" ownsteps:ci
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:2555/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:2555/api/health | grep -q '"ok"'
          # Not root: the entrypoint must have switched to the node user.
          docker exec ownsteps grep -qE '^Uid:\s+1000\s+1000\s+1000\s+1000$' /proc/1/status
          docker exec --user node ownsteps node -e "
            require('sharp')({ create: { width: 8, height: 8, channels: 3, background: '#fff' } })
              .jpeg().toBuffer().then((b) => console.log('sharp ok', b.length));
            new (require('better-sqlite3'))(':memory:').prepare('SELECT 1').get();
            console.log('better-sqlite3 ok');"
          # npm and friends were removed from the runtime stage.
          if docker exec ownsteps sh -c 'command -v npm || command -v npx || command -v corepack || command -v yarn'; then
            echo "::error::npm or yarn is still in the image"; exit 1
          fi
      - name: Server log
        if: always()
        run: docker logs ownsteps || true
      # Fails on high and critical vulnerabilities in the image (Debian
      # packages and node modules) that already have a fix – those go away
      # with a newer base image or dependency. Unfixed ones are only listed:
      # nothing here could do anything about them.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ownsteps:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      # Caches Gradle and checks the wrapper JAR against the published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew assembleDebug testDebugUnitTest

  ios:
    # The app needs the Swift 6.4 compiler: Xcode 26's Swift 6.3 crashes on
    # StepComposerView.swift. The xcode-27 image is still marked as preview
    # by GitHub; switch to the regular macOS image once it ships Xcode 27.
    runs-on: xcode-27
    env:
      # Pinned, so a new Xcode on the runner doesn't turn PRs red overnight.
      # Raise it together with the Xcode used for development.
      XCODE_APP: /Applications/Xcode_27.2.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s "$XCODE_APP"
      - run: swift test
        working-directory: ios/Packages/OwnStepsKit
      # The simulator build needs no signing; -skipPackagePluginValidation
      # trusts the OpenAPIGenerator plugin, which Xcode would ask about.
      - run: >
          xcodebuild -project OwnSteps.xcodeproj -scheme OwnSteps
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: ios

  # The single check main requires; it fails as soon as one job above failed
  # or was cancelled.
  passed:
    name: CI passed
    if: always()
    needs: [server, docker, android, ios]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All jobs passed."
