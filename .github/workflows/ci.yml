# Tests and builds every pull request and every push to main: server, Docker
# image, Android app and iOS app. "CI passed" at the end is the one check the
# main branch requires – Dependabot's auto-merge waits for it, see
# dependabot-auto-merge.yml.
#
# Green means "compiles and the tests pass", not "works": nothing here opens
# the map in a browser or taps through the apps (see "Never checked in a
# browser" in AGENTS.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR replaces the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same major as the Docker image (node:22).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts like in the Dockerfile: proves the prebuilt binaries
      # of better-sqlite3 and sharp suffice, and keeps install scripts of
      # updated packages from running here.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Includes the check that the iOS client's copy of openapi.json matches
      # the server.
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # amd64 only and never pushed; the release workflow builds both
      # platforms. Catches a base image that no longer fits the native modules.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      # Caches Gradle and checks the wrapper JAR against the published checksums.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew assembleDebug testDebugUnitTest

  ios:
    # The app needs the Swift 6.4 compiler: Xcode 26's Swift 6.3 crashes on
    # StepComposerView.swift. The xcode-27 image is still marked as preview
    # by GitHub; switch to the regular macOS image once it ships Xcode 27.
    runs-on: xcode-27
    env:
      # Pinned, so a new Xcode on the runner doesn't turn PRs red overnight.
      # Raise it together with the Xcode used for development.
      XCODE_APP: /Applications/Xcode_27.0.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s "$XCODE_APP"
      - run: swift test
        working-directory: ios/Packages/OwnStepsKit
      # The simulator build needs no signing; -skipPackagePluginValidation
      # trusts the OpenAPIGenerator plugin, which Xcode would ask about.
      - run: >
          xcodebuild -project OwnSteps.xcodeproj -scheme OwnSteps
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: ios

  # The single check main requires; it fails as soon as one job above failed
  # or was cancelled.
  passed:
    name: CI passed
    if: always()
    needs: [server, docker, android, ios]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All jobs passed."
