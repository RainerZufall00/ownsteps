# Turns on auto-merge for Dependabot's patch and minor updates of the server
# (npm) and the Android app (gradle). GitHub then merges once "CI passed" is
# green; a red check leaves the PR open. This needs "Allow auto-merge" in the
# repository settings and the required check on main – without the latter,
# auto-merge would merge at once, untested.
#
# Also merges new builds of the Docker base image – but only when the PR
# changes nothing but the digest after an unchanged tag (node:22-trixie-slim
# stays node:22-trixie-slim). Those carry Debian and Node 22 security and bug
# fixes; CI starts the image and scans it before the merge (ci.yml, docker).
# Merging only changes main: installations get it with the next release.
#
# Stays manual: major updates, a changed base image tag, GitHub Actions, the
# Swift packages (see dependabot.yml), and next, react and maplibre-gl, whose
# breakage the tests don't catch.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$ECOSYSTEM" = docker ]; then
            # Every changed line must be a FROM line, and with the digests
            # removed the old and the new lines must be the same.
            diff=$(gh pr diff "$PR_URL")
            changed=$(grep -E '^[-+]' <<<"$diff" | grep -vE '^(\+\+\+|---) ' || true)
            if grep -qvE '^[-+]FROM [^ ]+@sha256:[0-9a-f]{64}( |$)' <<<"$changed"; then
              echo "Not a digest-only update, merged by hand."; exit 0
            fi
            strip() { grep -E "^$1" <<<"$changed" | cut -c2- | sed -E 's/@sha256:[0-9a-f]{64}//' | sort; }
            if [ -z "$changed" ] || [ "$(strip -)" != "$(strip '\+')" ]; then
              echo "The base image tag changed, merged by hand."; exit 0
            fi
            gh pr merge --auto --squash "$PR_URL"
            exit 0
          fi
          case "$ECOSYSTEM" in
            npm_and_yarn|gradle) ;;
            *) echo "Ecosystem $ECOSYSTEM is merged by hand."; exit 0 ;;
          esac
          # For a group this is the largest update in it.
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *) echo "Update type '$UPDATE_TYPE' is merged by hand."; exit 0 ;;
          esac
          # dependency-names is "a, b, c".
          for name in next react react-dom maplibre-gl; do
            if [[ ", $NAMES," == *", $name,"* ]]; then
              echo "$name is merged by hand."; exit 0
            fi
          done
          gh pr merge --auto --squash "$PR_URL"
