# Builds the Docker image for amd64 and arm64 and publishes it to the GitHub
# Container Registry when a version is tagged (git tag v1.2.3 && git push --tags),
# then creates the GitHub release from that version's section in CHANGELOG.md.
# Installations update with `docker compose pull && docker compose up -d`.
#
# Started by hand with a version (Actions → Docker image → Run workflow, or
# `gh workflow run docker.yml -f version=1.2.3`), it does the same for the
# chosen branch's commit and creates the tag along with the release. That is
# for whoever can't push tags, such as cloud sessions. Started by hand without
# a version on a tag, it only rebuilds that tag's image.
name: Docker image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release from this branch, e.g. 1.2.3 (empty: only rebuild the image)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only for a manual run with a version: it must match package.json and
      # must not be released yet. Empty otherwise, then the pushed tag counts.
      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          [ -n "$VERSION" ] || exit 0
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi
          PACKAGE=$(node -p 'require("./package.json").version')
          if [ "$PACKAGE" != "$VERSION" ]; then
            echo "::error::package.json says $PACKAGE, not $VERSION"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Registry names must be lowercase; the repository owner may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 becomes 1.2.3, 1.2, 1 and latest – pin whichever you like.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
          flavor: latest=auto

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Fresh Debian security updates in every build, see the Dockerfile.
          build-args: APT_REFRESH=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Only this job may write to the repository, the image build doesn't need to.
  # A manual run without a version rebuilds the image and creates no release.
  release:
    needs: image
    if: github.event_name == 'push' || needs.image.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.image.outputs.tag || github.ref_name }}
          NEW_TAG: ${{ needs.image.outputs.tag != '' }}
        run: |
          # Everything between "## [1.2.3] – date" and the next version heading.
          awk -v heading="## [${TAG#v}]" \
            'index($0, "## [") == 1 { found = index($0, heading) == 1; next } found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $TAG"
            exit 1
          fi
          # A manual run creates the tag on the commit the image was built
          # from. Tags made with GITHUB_TOKEN start no further workflow run.
          if [ "$NEW_TAG" = true ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag \
              --title "$TAG" --notes-file notes.md
          fi
