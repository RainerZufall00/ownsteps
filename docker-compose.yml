services:
  ownsteps:
    # "latest" follows every release. To update on your own terms, pin a
    # version instead, e.g. :1 (all 1.x) or :1.2.3.
    image: ghcr.io/rainerzufall00/ownsteps:latest
    container_name: ownsteps
    restart: unless-stopped
    env_file: .env
    ports:
      # Inside the container the app always runs on 2555. BIND_ADDRESS and
      # HOST_PORT only determine the outside.
      #
      # If the reverse proxy or tunnel client (newt, Traefik, npm) runs on the
      # same host, set BIND_ADDRESS=127.0.0.1 – the port is then only
      # reachable locally and not open to the network.
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-2555}:2555"
    volumes:
      # Holds ownsteps.db and all uploaded photos – this is the backup.
      - ./data:/data

    # Only needed if the proxy itself runs as a container in a bridge network
    # (Traefik, nginx-proxy-manager). Then add its network here and use
    # "http://ownsteps:2555" as the target. Not relevant for tunnel clients in
    # the host network (e.g. newt) – they reach the app via 127.0.0.1.
    #
    # networks:
    #   - proxy
    #   - default

# networks:
#   proxy:
#     external: true
#     name: <name-of-the-proxy-network>
